name: Deploy to Cloudways

# Auto-deploys ecgmeans.com to Cloudways on every push to main.
# Requires two GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDWAYS_EMAIL    - your Cloudways account email
#   CLOUDWAYS_API_KEY  - the Access Token from Cloudways -> Account -> API
# Server/app IDs are not secret and are set below.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CW_EMAIL: ${{ secrets.CLOUDWAYS_EMAIL }}
      CW_API_KEY: ${{ secrets.CLOUDWAYS_API_KEY }}
      CW_SERVER_ID: "1638726"
      CW_APP_ID: "6684252"
      CW_BRANCH: "main"
    steps:
      - name: Resolve Cloudways bearer token
        id: token
        run: |
          set -e
          if [ -z "$CW_EMAIL" ] || [ -z "$CW_API_KEY" ]; then
            echo "::error::CLOUDWAYS_EMAIL and CLOUDWAYS_API_KEY secrets are not set."
            exit 1
          fi
          RESP=$(curl -s -X POST https://api.cloudways.com/api/v1/oauth/access_token -d "email=$CW_EMAIL" -d "api_key=$CW_API_KEY" || true)
          BEARER=$(printf '%s' "$RESP" | grep -o '"access_token"[^,}]*' | head -1 | sed 's/.*"access_token"[^"]*"//; s/"$//')
          if [ -z "$BEARER" ]; then BEARER="$CW_API_KEY"; fi
          echo "::add-mask::$BEARER"
          echo "token=$BEARER" >> "$GITHUB_OUTPUT"
      - name: Trigger Git pull (deploy) on Cloudways
        id: pull
        run: |
          set -e
          RESP=$(curl -s -X POST https://api.cloudways.com/api/v1/git/pull -H "Authorization: Bearer ${{ steps.token.outputs.token }}" -d "server_id=$CW_SERVER_ID" -d "app_id=$CW_APP_ID" -d "branch_name=$CW_BRANCH")
          echo "Git pull response: $RESP"
          echo "$RESP" | grep -qi 'error\|invalid\|unauth' && { echo "::error::Cloudways git pull failed"; exit 1; } || true
          OP=$(printf '%s' "$RESP" | grep -o '"operation_id"[^,}]*' | grep -o '[0-9A-Za-z-]*$' | head -1)
          echo "op=$OP" >> "$GITHUB_OUTPUT"
      - name: Wait for the Git pull to finish
        run: |
          OP="${{ steps.pull.outputs.op }}"
          if [ -z "$OP" ]; then echo "No operation id returned; waiting 45s instead"; sleep 45; exit 0; fi
          for i in $(seq 1 40); do
            R=$(curl -s "https://api.cloudways.com/api/v1/operation/$OP" -H "Authorization: Bearer ${{ steps.token.outputs.token }}")
            DONE=$(printf '%s' "$R" | grep -o '"is_completed"[^,}]*' | grep -o '\-\?[0-9]' | head -1)
            echo "poll $i: is_completed=$DONE"
            [ "$DONE" = "1" ] && exit 0
            [ "$DONE" = "-1" ] && { echo "::error::Git pull operation failed: $R"; exit 1; }
            sleep 6
          done
          echo "::warning::Git pull still running after 4 minutes; purging anyway"
      - name: Purge cache (after the pull has finished)
        run: |
          AUTH="Authorization: Bearer ${{ steps.token.outputs.token }}"
          echo "App purge:    $(curl -s -X POST https://api.cloudways.com/api/v1/app/manage/varnish -H "$AUTH" -d "server_id=$CW_SERVER_ID" -d "app_id=$CW_APP_ID" -d "action=purge")"
          echo "Server purge: $(curl -s -X POST https://api.cloudways.com/api/v1/service/varnish -H "$AUTH" -d "server_id=$CW_SERVER_ID" -d "action=purge")"
      - name: Verify the live site is serving fresh pages
        run: |
          sleep 5
          for u in / /sitemap.xml /ads.txt; do
            H=$(curl -s -o /dev/null -D - "https://www.ecgmeans.com$u")
            CODE=$(printf '%s' "$H" | head -1); AGE=$(printf '%s' "$H" | grep -i '^age:' | tr -dc '0-9')
            echo "$u -> $CODE age=${AGE:-0}"
            case "$CODE" in *200*) ;; *) echo "::error::$u is not returning 200"; exit 1;; esac
            if [ "${AGE:-0}" -gt 300 ]; then echo "::error::$u is still a stale cached copy (age ${AGE}s) - purge did not take effect"; exit 1; fi
          done
      - name: Notify search engines (IndexNow - Bing, Yandex, Seznam, Naver)
        continue-on-error: true
        env:
          INDEXNOW_KEY: "7f3c9a1e5d2b48c6a0e4f1b9d8c27e53"
        run: |
          curl -sf "https://www.ecgmeans.com/$INDEXNOW_KEY.txt" | grep -q "$INDEXNOW_KEY" || { echo "key file not live"; exit 0; }
          URLS=$(curl -s https://www.ecgmeans.com/sitemap.xml | grep -o '<loc>[^<]*</loc>' | grep -v '/assets/' | sed 's#<loc>\(.*\)</loc>#"\1"#' | paste -sd, -)
          BODY="{\"host\":\"www.ecgmeans.com\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://www.ecgmeans.com/$INDEXNOW_KEY.txt\",\"urlList\":[$URLS]}"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" -d "$BODY")
          echo "IndexNow response: $CODE (200/202 = accepted)"
